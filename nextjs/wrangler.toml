# Wrangler configuration for Cloudflare Pages deployment
# See: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "maxpetrusenko-nextjs"
compatibility_date = "2024-12-01"

# Enable Node.js compatibility for Next.js
compatibility_flags = ["nodejs_compat"]

# Build output directory for Pages deployment
pages_build_output_dir = ".vercel/output/static"

# KV namespace bindings
[[kv_namespaces]]
binding = "EMAIL_SUBS"
id = "90a570d807f04bc4abb9b46282291e5b"

[[kv_namespaces]]
binding = "CONCIERGE_THREADS"
id = "6a8dcc40d55d440b8b2c7e046f539ea7"

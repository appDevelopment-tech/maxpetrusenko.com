# ----------------------------------------------------------------- positional regime
# What a node needs AT A POSITION, when it hangs off (parent @type, property).
# '*"' as the parent type means any parent. Tuples are ABSOLUTE for that position: an
# empty list means 'this position requires nothing' and does NOT fall through to the
# per-type row above. A position absent here falls through to the per-type row unchanged.
# This exists because the per-type row was applied to every node everywhere, which is where
# ~89 unfixable findings came from: a Place used as areaServed, an Organization used as a
# publisher stub, an Offer used as a catalogue entry are different regimes from the subject.

[[positions]]
parent = "OfferCatalog"
property = "itemListElement"
[[positions.children]]
type = "Offer"
required = []

[[positions]]
parent = "*"
property = "publisher"
[[positions.children]]
type = "Organization"
required = []

[[positions]]
parent = "*"
property = "seller"
[[positions.children]]
type = "Organization"
required = ["name"]

[[positions]]
parent = "*"
property = "areaServed"
[[positions.children]]
type = "Place"
required = ["name"]
[[positions.children]]
type = "AdministrativeArea"
required = ["name"]
[[positions.children]]
type = "City"
required = ["name"]
[[positions.children]]
type = "Country"
required = ["name"]

[[positions]]
parent = "*"
property = "location"
[[positions.children]]
type = "Place"
required = ["name"]
[[positions.children]]
type = "VirtualLocation"
required = ["name"]

[[positions]]
parent = "*"
property = "itemOffered"
[[positions.children]]
type = "Service"
required = ["name"]
[[positions.children]]
type = "Product"
required = ["name"]


# sd-required.toml -- the required/recommended property table, as DATA.
#
# Canonical here in manager; vendored verbatim into consumer repos next to sd-check.py.
# Extracted from sd-check.py with ast (tools/extract_sd_table.py), so the code table and this
# file cannot disagree: the checker reads THIS file, and the extraction is compared entry for
# entry. Adding a field Google reports on is a one-line data edit, in one shared place, for
# every site -- instead of a per-repo dict that covers whatever its author remembered.
#
# Semantics, unchanged from the in-code table:
#   required    -- a Google page says the property is required; missing => error band
#                  (except INFO_TYPES, which are reported but never block, and the '|'
#                  alternative syntax, where either side satisfies the requirement)
#   recommended -- the property is listed by Google but not required; missing => warn band.
#                  This is the band Google's own Search Console calls 'non-critical'.
#   info_types  -- node types whose required-props findings are reported, never blocking.

# Top-level keys first: in TOML every key after a [table] header belongs to that table,
# so an info_types written below [meta] would silently become meta.info_types.
info_types = [
  "Answer",
  "Course",
  "CourseInstance",
  "FAQPage",
  "Question",
]

[meta]
schema_version = 1
table_version  = 1
source         = "sd-check.py REQUIRED_PROPS (ast-extracted)"
source_checker = "https://developers.google.com/search/docs/appearance/structured-data/search-gallery"


# sd-gate.toml — the invocation is data (plan §A5.2 / §A1.9)
#
# Read with `python3 .github/scripts/sd-check.py --config .github/scripts/sd-gate.toml`.
# Kept in the repo, hashed by the drift guard, so the same validator cannot run
# with silently different strictness in two repos.
#
# PATH RESOLUTION: Gate.resolve() joins every relative value below with the
# DIRECTORY OF THIS FILE (`.github/scripts/`), not the repo root. Hence the
# `../../` prefixes. Verified against sd-check 1.5.0 (sha256
# 3f8020499dfae2450768f3734a5927590a985bb030a05f3cbb9e3da01cb3a7ca, vendored; sd-policy.toml
# 9c56ba5e78673294ea054d0a5b37e445892e3d71be9083f91f69e58d09ecfe64).  The baseline below was
# re-captured with this vendored 1.5.0 copy: 1.5.0 changed rules 8 and 16 and stopped hashing
# `required_present`, so the pre-1.5.0 baseline mass-flagged every route on shape-digest.
#
# TOML has no partial dates: a month-only date must be QUOTED ("2026-06").
# Unquoted partial dates make the file malformed, and a malformed config is an
# internal failure — exit 2, "the gate broke", never "the site broke".

[gate]
mode  = "dir"
site  = "www.maxpetrusenko.com"

# Surface choice — MEASURED, not assumed.
#
# Both adapter shapes were built twice from a clean `.vercel/output` on
# 2026-09-12 (base 6f9a20b, @cloudflare/next-on-pages 1.13.16) and read with
# sd-check 1.0.0:
#
#   .vercel/output/static ........................... 203 HTML files -> 131 route keys
#     of which 69 keys are DUPLICATED: `medium/<slug>.html` (the real page,
#     2 JSON-LD blocks) AND `medium/<slug>/index.html` (a 0-block twin). The
#     twin is re-emitted by every clean build, so it is adapter output, not
#     stale residue.
#   .vercel/output/functions/**/*prerender-fallback.html  131 HTML files -> 129 route keys
#   fallback-only route keys ........................ 0
#   static-only route keys .......................... 2  (/500, /cdn-cgi/errors/*; 0 JSON-LD each)
#
# The plan's §A4 preflight predicted "62 static files plus 61 MORE that exist
# only as prerender-fallbacks, so reading static/ alone misses about half the
# routes". That does NOT reproduce on this tree: the fallback surface is a
# strict SUBSET of static by route key and every one of its 129 routes carries
# the same block count and @type multiset as its static twin (asserted by
# `nextjs/scripts/check-sd-surface-parity.mjs`, `npm run sd:parity`).
#
# One surface only, and it is the FALLBACK surface, deliberately:
#   - sd-check does not dedupe route keys within a surface, so the 69 static
#     twins are each validated against the same baseline entry. Measured
#     consequence of pointing the gate at `static/`: 69 false `shape-digest`
#     errors (E) plus 69 false `content-snapshot` warnings on EVERY run, for
#     routes whose markup is perfectly fine. Once bands are promoted that would
#     block every deploy for a reason that has nothing to do with the site.
#   - the fallback surface covers 129/129 content routes with 0 duplicate keys,
#     and is provably equivalent to the served static HTML on every one of them
#     (parity result, same adapter version).
#   - adding the fallback surface ON TOP OF static doubles every finding
#     (1018 -> 2036 errors) with zero additional route coverage.
#
# MIGRATION TRIGGER: when @cloudflare/next-on-pages stops emitting the
# `<slug>/index.html` twins (or sd-check gains per-surface dedupe), switch this
# value to `../../nextjs/.vercel/output/static`. The parity run prints the
# duplicate-key count, so the switch is visible without re-measuring by hand.
surface = ["../../nextjs/.vercel/output/functions/**/*prerender-fallback.html"]

policy = "sd-policy.toml"

baseline = "../../tests/fixtures/sd-baseline/maxpetrusenko"

# The committed expected-route list (§A4.4: never capture a baseline from a
# different surface than the gate reads). Sitemap-shaped XML; the validator
# extracts `<loc>` and reduces each to a path.
coverage_manifest = "../../tests/fixtures/sd-coverage/maxpetrusenko-routes.xml"

# Canonical host SET, not one host.  www.maxpetrusenko.com and wa.me are
# trusted; atelier.maxpetrusenko.com is DELIBERATELY ABSENT.
#
# It was added here during integration as "Max's own second surface" and that
# made the gate blind to every URL pointing at it.  That was the one place the
# allowlist absorbed a real finding: the hostname resolved into a different
# brand's property, and the record plus the Pages project behind it have since
# been deleted (NXDOMAIN; a 530 from the edge while the local resolver cache
# drained).  Trusting a host that no longer exists is indefensible, and the
# site's own references to it were removed rather than exempted -- the gate
# reads 0 url-host findings because nothing points there, not because the host
# is trusted.  If atelier ever returns as a real Max-owned surface, re-admit it
# here with the reason recorded and a date.
allowed_hosts = ["www.maxpetrusenko.com", "wa.me"]

# LANE MANDATE: this repo runs report-only for the whole wiring lane. Findings
# never produce exit 1; internal failures still exit 2 (§A5.3). Band promotion is
# an integration decision (§D1/R3) and is recorded in [bands] below.
report_only = false
strict = false

# markup_optional -- routes that may legitimately carry NO JSON-LD (rule E
# `no-markup`).  Absence of this key means EVERY walked route must carry
# structured data.  Matching is on the derived lowercase route key, whole-segment
# or prefix glob, and the skip is PRINTED into the report and the notes array --
# an exemption a reader cannot see is indistinguishable from a page that quietly
# dropped its markup.
#
#   /tantra-massage-ubud   PERMANENT REDIRECT, not a content page.
#                          nextjs/app/tantra-massage-ubud/page.tsx is a 3-line
#                          stub whose whole body is `redirect("/spirituality")`,
#                          so it emits HTTP 307 and never renders a document.
#                          The adapter still emits a prerender-fallback artifact
#                          for the path (the Next.js error shell carrying the
#                          NEXT_REDIRECT digest), and that artifact is what the
#                          surface walk reads and what the coverage manifest
#                          lists -- hence one `no-markup` finding for a route
#                          that cannot have markup by construction.
#                          Adding a JSON-LD block to a redirect would mean
#                          inventing markup for a page no crawler indexes: the
#                          redirect target /spirituality is the page that
#                          carries the practice's structured data.
markup_optional = ["/tantra-massage-ubud"]

# coverage_optional -- routes that can be in the coverage manifest (the sitemap) but
# can NEVER have a baseline entry, because the build does not emit a file for them.
# Absence of this key means every manifest route must have a baseline record.
# Matched the same way as markup_optional, and PRINTED as a skip with the matched
# pattern -- a suppression a reader cannot see is indistinguishable from a rule that
# silently stopped working.
#
# Scoped to THIS direction only.  A baseline route that vanishes from the build is
# still an error even with a "/*" pattern here: "no baseline record is possible by
# construction" cannot justify a route that stopped being built.
coverage_optional = ["/"]

# Per-rule band overrides. Empty on purpose: nothing is promoted yet, and a
# promotion must be a one-line diff here rather than an edit to a workflow.
#
# MEASURED ERROR BAND, after the burn-down (2026-09-12, pinned vendored sd-check
# 1.5.0, REAL `npm run pages:build` surface, 129 routes):
#
#   coverage                1 E  manifest route "/" has no baseline entry -- see
#                                THE RESIDUAL below. NOT fixable in this file.
#   duplicate-type-conflict 0 E  was 15 E  -- one human was declared twice per page
#   no-markup               0 E  was  1 E  -- /tantra-massage-ubud, declared above
#   url-host                0 E
#   missing-required        0 E
#   rating-consistency      0 E
#   date-sanity             0 E
#   placeholder-text        0 E
#   context-missing         0 E
#
# summary line: error=1 warn=878 info=32 routes_checked=129 routes_expected=130
#
# THE 1.5.1 KEY CLOSED THE RESIDUAL -- so report_only is now FALSE.
#
# Kept as history, because the reasoning is the point:
#   * The band was 1 and the only finding was `coverage /`.  That rule compares the
#     coverage manifest (the sitemap) against the baseline.  "/" is a dynamic Next.js
#     function -- this build emits .vercel/output/functions/index.func and never a
#     static html file -- so no baseline record for it is possible BY CONSTRUCTION.
#     An unfixable error is worse than no gate: it teaches everyone to read a red
#     band as noise.
#   * `markup_optional` affects `no-markup` alone, so no route-level key could express
#     this.  The honest fix was validator-side -- never a hand-written baseline entry
#     for a page the build cannot emit, and never deleting "/" from the sitemap where
#     it belongs.
#   * Validator 1.5.1 adds `coverage_optional`, matched like `markup_optional` and
#     PRINTED as a skip.  Declared below.
#   * Measured after declaring it: error=0 warn=878 info=32 routes_checked=129
#     routes_expected=130.  With a zero error band, report_only flips to FALSE --
#     band promotion is an integration decision and this records what justified it.
#     strict stays false: ~878 warn-band findings must not block a deploy.

[bands]

# NOTE: wa.me is in allowed_hosts (not reference_allowlist) because the two
# remaining rule-11 findings on this site are an IDENTITY url on
# /mindfold/events pointing at the WhatsApp booking link, not an image.
# TABLE ORDER: [hosts] must stay last in this file. In TOML every key after a
# table header belongs to that table, so inserting [hosts] above report_only
# moves report_only out of [gate] and silently turns report-only into a
# failing gate. Measured during integration: exit 1, 191 error-band findings.
[hosts]
reference_allowlist = []

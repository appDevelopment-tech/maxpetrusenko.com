# sd-policy.toml -- Google structured-data policy as DATA, not code.
#
# Owned by the manager repo (canonical).  Vendored verbatim into consumer repos
# by the orchestrator (§D1/R2).  Reacting to an announcement is a data edit, not
# a code change (§A1.1).
#
# ---------------------------------------------------------------------------
# HONEST LIMIT (stated here on purpose, §A2.4 rule 5)
# ---------------------------------------------------------------------------
# Whether a cited date ACTUALLY APPEARS in the cited source cannot be automated.
# Every entry carries source_url + last_verified, and the weekly staleness job
# (§A2.3) HEADs every source_url and fails past `staleness_max_days`.  That
# calendar forcing function is the whole mechanism.  Do not read a green
# staleness run as "the citation says what we think it says".
#
# ---------------------------------------------------------------------------
# Match semantics (§A2.2)
# ---------------------------------------------------------------------------
# An entry fires when:   node @type in match.types
#                    AND every property in match.all_props is present
#                    AND match.any_props is absent or intersects
# Precedence: an entry WITH property constraints wins over a type-only entry.
#   Required because the `learning-video` predicate (VideoObject + a learning
#   property) collides with the ACTIVE generic VideoObject row.
# Bands:  E error, W warn, I info, "-" observation only (never affects exit).
# Status: active | reinstated | retired_from_reporting | feature_removed |
#         out_of_scope | quota
#
# match.types MUST resolve against the pinned snapshot named in
# [meta].vocab_snapshot.  A key on a feature name can never fire: it passes
# silently while the markup goes unmatched.  That is a gate configuration
# error and the validator exits 2 on it (§A2.4 rule 1).
#
# Year-month values are quoted strings: TOML has no year-month type, and
# pretending otherwise would make "2026-06" silently mean something else.
#
# A documentary entry (`match.types = []`) never matches a node.  It exists so
# policy facts with no schema.org type -- quotas, report features -- live in the
# same data file with the same citation discipline.  It can never fire, which
# is exactly its stated band ("-").

[meta]
schema_version     = 1
policy_version     = 1
staleness_max_days = 90
vocab_snapshot     = "schema-org-types.txt"   # pinned list, §A2.4
vocab_version      = "30.0"
vocab_fetched      = 2026-09-12
vocab_source_url   = "https://schema.org/version/latest/schemaorg-current-https.jsonld"


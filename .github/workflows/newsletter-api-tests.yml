name: newsletter-api tests

# Runs the Worker's vitest suite (checkout, tickets, webhook, abuse controls) on
# every PR and push that touches it. Tests mock Stripe; no secrets needed.

on:
  pull_request:
    paths:
      - 'nextjs/workers/newsletter-api/**'
      - '.github/workflows/newsletter-api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'nextjs/workers/newsletter-api/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs/workers/newsletter-api/newsletter-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs/workers/newsletter-api/newsletter-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx wrangler types
      - run: npx tsc --noEmit -p .
      - run: npm test -- --run

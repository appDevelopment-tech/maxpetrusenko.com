name: Cloudflare Pages Fallback Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-fallback-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # sd-check asserts >= 3.11 (tomllib) and exits 2 below it

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Verify predeploy
        run: npm run verify:predeploy

      - name: Build Pages output
        run: npm run pages:build

      # ---------------------------------------------------------------------
      # Replaces the standalone `python3 scripts/check-jsonld.py .` step.
      # check-jsonld.py was parse-only and ran nowhere on push; sd-check is the
      # canonical validator and its parse rule (rule 1, band E) is a strict
      # superset. Strictness comes from sd-gate.toml, not from this step.
      #
      # NOTE: the gate reads the built artifacts, so it must run AFTER
      # pages:build — that is why it is not inside verify:predeploy.
      # ---------------------------------------------------------------------
      - name: Validate structured data (sd-check, dir mode)
        working-directory: .
        run: |
          python3 .github/scripts/sd-check.py \
            --config .github/scripts/sd-gate.toml \
            --json /tmp/sd-report-fallback-deploy.json

      - name: Validate structured-data surface parity
        working-directory: nextjs
        env:
          # §A4.2 adapter pin — see seo-indexing-gate.yml. Bump with the lockfile.
          NEXT_ON_PAGES_PIN: '1.13.16'
        run: |
          node scripts/check-sd-surface-parity.mjs \
            --surface static=.vercel/output/static \
            --surface fallback='.vercel/output/functions/**/*prerender-fallback.html' \
            --sample 0 \
            --expect-adapter "${NEXT_ON_PAGES_PIN}" \
            --report-only \
            --json /tmp/sd-parity-fallback-deploy.json

      - name: Upload structured-data reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-report-fallback-deploy
          path: |
            /tmp/sd-report-fallback-deploy.json
            /tmp/sd-parity-fallback-deploy.json

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=maxpetrusenko-nextjs --branch=main
